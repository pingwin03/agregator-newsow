<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie - Agregator Zagrożeń</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        /* Zmodyfikowany przycisk logowania (dodana dedykowana klasa) */
        .submit-btn { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .submit-btn:hover { background: #004085; }

        /* Style dla naszej wtyczki hasła */
        .password-wrapper { position: relative; display: block; margin-bottom: 15px; }
        .password-wrapper input { margin-bottom: 0; padding-right: 40px; } /* Robię miejsce na ikonę */
        .toggle-password { 
            position: absolute; 
            right: 10px; 
            top: 50%; 
            transform: translateY(-50%); 
            background: none; 
            border: none; 
            cursor: pointer; 
            padding: 0; 
            width: auto;
            font-size: 1.2rem;
            color: #555;
        }
        .toggle-password:hover { background: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Logowanie</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="submit-btn">Zaloguj się</button>
        </form>
        <p style="text-align: center; margin-top: 15px;"><a href="{% url 'home' %}">&larr; Powrót do strony głównej</a></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Kuloodporna metoda: szukam pola po jego typie, niezależnie od tego jakie ma wygenerowane ID
            const passwordInput = document.querySelector('input[type="password"]');
            
            if (passwordInput) {
                // Tworzę kontener dla pola i ikony
                const wrapper = document.createElement('div');
                wrapper.className = 'password-wrapper';
                
                // Wstawiam nowy kontener przed standardowym polem hasła
                passwordInput.parentNode.insertBefore(wrapper, passwordInput);
                // Przenoszę pole hasła do jego wnętrza
                wrapper.appendChild(passwordInput);
                
                // Tworzę interaktywny przycisk "oczka"
                const toggleBtn = document.createElement('button');
                toggleBtn.type = 'button';
                toggleBtn.className = 'toggle-password';
                toggleBtn.innerHTML = '👁️';
                toggleBtn.title = 'Pokaż hasło';
                
                // Dołączam przycisk do kontenera
                wrapper.appendChild(toggleBtn);
                
                // Nasłuchuję zdarzenia kliknięcia i przełączam typ pola (text <-> password)
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault(); // Zapobiega ewentualnemu wysłaniu formularza po kliknięciu
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        toggleBtn.innerHTML = '🙈'; // Zmieniam ikonę
                        toggleBtn.title = 'Ukryj hasło';
                    } else {
                        passwordInput.type = 'password';
                        toggleBtn.innerHTML = '👁️';
                        toggleBtn.title = 'Pokaż hasło';
                    }
                });
            } else {
                console.log("Skrypt nie znalazł pola hasła.");
            }
        });
    </script>
</body>
</html>
