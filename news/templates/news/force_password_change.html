<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wymagana Zmiana Hasła - Agregator Zagrożeń</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f6f9; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; }
        input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .helptext { font-size: 0.8rem; color: #666; display: block; margin-top: -10px; margin-bottom: 15px; }
        .errorlist { color: #dc3545; padding-left: 0; list-style: none; font-size: 0.85rem; font-weight: bold; }
        
        .submit-btn { width: 100%; padding: 10px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .submit-btn:hover { background: #c82333; }

        /* Style dla wtyczki hasła */
        .password-wrapper { position: relative; display: block; margin-bottom: 15px; }
        .password-wrapper input { margin-bottom: 0; padding-right: 40px; }
        .toggle-password { 
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%); 
            background: none; border: none; cursor: pointer; padding: 0; width: auto; font-size: 1.2rem; color: #555;
        }
        .toggle-password:hover { background: none; }
        
        .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Aktualizacja Bezpieczeństwa</h2>
        <div class="alert-warning">
            Ze względów bezpieczeństwa, przed kontynuacją pracy z systemem musisz zmienić swoje wygenerowane hasło startowe.
        </div>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="submit-btn">Zmień hasło i przejdź do pulpitu</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const passwordInputs = document.querySelectorAll('input[type="password"]');
            
            passwordInputs.forEach(function(passwordInput) {
                const wrapper = document.createElement('div');
                wrapper.className = 'password-wrapper';
                
                passwordInput.parentNode.insertBefore(wrapper, passwordInput);
                wrapper.appendChild(passwordInput);
                
                const toggleBtn = document.createElement('button');
                toggleBtn.type = 'button';
                toggleBtn.className = 'toggle-password';
                toggleBtn.innerHTML = '👁️';
                toggleBtn.title = 'Pokaż hasło';
                
                wrapper.appendChild(toggleBtn);
                
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        toggleBtn.innerHTML = '🙈';
                        toggleBtn.title = 'Ukryj hasło';
                    } else {
                        passwordInput.type = 'password';
                        toggleBtn.innerHTML = '👁️';
                        toggleBtn.title = 'Pokaż hasło';
                    }
                });
            });
        });
    </script>
</body>
</html>
